# simgen: common-resolution / wide-beam-spread test simulation.
#
#   mpirun -n 8 c4-simgen -p simgen/params/param_common_res.yml
#
# Analysed by `params/sims/simparam_compsep_perpix.yml`.
#
# INJECTED TRUTH, what the analysis has to recover:
#   * Per-component amplitude maps, written as `truth_<Component>.fits` in `debug_output_dir`.
#     They are unsmoothed, so an analysis that smooths every band to a common beam recovers them
#     convolved with that beam, not the maps themselves.
#   * beta_dust = 1.54 (nu_ref = 353 GHz), beta_sync = -3.10 (nu_ref = 30 GHz).
#   * 72 point sources of 2000 uK_RJ each on a regular 12 x 6 grid, frequency-independent. These
#     also get `catalogue_PointSources.dat` in `debug_output_dir`, the source list in the format
#     Commander4's `RadioSources` reads (`template_path`). A truth *map* is no use to that
#     component, which models sources as a catalogue painted through the band beam. The fluxes are
#     in mJy and assume this file's `nside`, since a source here is one pixel of that grid.
#
# WHY THIS IS A COMMON-RESOLUTION TEST:
#   * The four beams span 100' to 30', a factor 3.3 in width. That is the point of the file: it is
#     the only simulation here where the bands are at genuinely different resolutions. Measured as
#     the ratio of the sharpest to the broadest beam window, the spread is 1.19x at l=50, 2.02x at
#     l=100, 4.82x at l=150 and 16.3x at l=200. For comparison `param_compsep.yml` reaches only
#     1.17x at l=100, so a bug in beam handling barely registers there.
#   * nside 128 (lmax 383, 27.5' pixels) keeps even the 30' beam resolved, so the beam spread is
#     carried by the data rather than truncated by the pixel window.
#   * The gridded point sources are delta functions before smoothing, which makes them the sharpest
#     available probe of the beam: at common resolution every source must come out as the *same*
#     profile in every band. A smoothing or deconvolution error shows up as a band-dependent source
#     width or amplitude, which is far easier to see than the same error spread over a diffuse map.
#   * White noise, unit gains and no 1/f, so nothing on the TOD side competes with the compsep step.
#
# NOTE that the analysis must set `compsep.common_res_fwhm` to at least 100', the broadest beam.
# The per-pixel solver has no beam model at all, so it silently mixes resolutions if that is unset.

general:
  nside: 128
  units: "uK_RJ"
  float_precision: "single"
  seed: 71
  output_dir: "../c4_sims/simgen_common_res/"

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      shortname: "cmb"
      lmax: 383
      solar_dipole: false

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      shortname: "dust"
      beta: 1.54
      T: 20
      nu_ref: 353
      lmax: 383
      template: {source: "pysm3", preset: "d0"}

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      shortname: "sync"
      beta: -3.1
      nu_ref: 30
      lmax: 383
      template: {source: "pysm3", preset: "s5"}

  # Delta functions on a regular grid: the sharpest probe of whether every band really ends up at
  # the same resolution. Intensity only, and frequency-independent (beta: 0.0), so the same source
  # amplitude is expected in every band once they are smoothed to a common beam.
  PointSources:
    enabled: true
    component_class: "GriddedPointSources"
    params:
      polarization: "I"
      shortname: "ptsrc"
      amplitude: 2000.0        # uK_RJ per source, before beam smoothing
      nlon: 12
      nlat: 6
      lat_range_deg: [-70.0, 70.0]
      beta: 0.0                # flat SED: identical amplitude in every band
      nu_ref: 100.0

simulation:
  # 2400 x 600 s = 16.7 days. The accelerated 18-day anti-Sun period sweeps 333 deg, while the
  # Planck-like 7.5 deg tilt and half-year precession ratio give dense, cross-linked scan rings.
  nscans: 2400
  scan_duration_sec: 600
  npsi: 4096
  orbital_dipole: true
  compress: true
  debug_output_dir: "../c4_sims/simgen_common_res_debug/"

  pointing:
    strategy: "planck_scan"
    los_angle: 85.0
    spin_angle_tilt: 7.5
    spin_rate: 1.00165345964511
    anti_sun_period_days: 18.0
    precession_period_days: 9.0
    mission_start: "2009-08-13T00:00:00"

  noise:
    white: true
    oof: {enabled: false}

  modifiers:
    crosstalk: {enabled: false}

  transfer_function:
    enabled: false

experiments:
  SimSat:
    enabled: true
    bands:
      # The beams are the whole point of this file: 100' -> 30' across four bands, so smoothing to a
      # common resolution is a large operation rather than a rounding correction. sigma0 is common
      # across bands so the exercise stays about resolution, not about relative band weights.
      Band30GHz:
        enabled: true
        freq: 30.0
        fwhm: 100.0
        fsamp: 32.5
        eval_nside: 128
        data_nside: 128
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det30_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det30_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det30_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det30_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band100GHz:
        enabled: true
        freq: 100.0
        fwhm: 70.0
        fsamp: 32.5
        eval_nside: 128
        data_nside: 128
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det100_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det100_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det100_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det100_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band217GHz:
        enabled: true
        freq: 217.0
        fwhm: 45.0
        fsamp: 32.5
        eval_nside: 128
        data_nside: 128
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det217_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det217_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det217_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det217_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band353GHz:
        enabled: true
        freq: 353.0
        fwhm: 30.0
        fsamp: 32.5
        eval_nside: 128
        data_nside: 128
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det353_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det353_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det353_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det353_d: {psi_offset_deg: 135.0, gain: 1.0}
