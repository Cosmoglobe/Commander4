# simgen: bolometer transfer-function simulation (the "TF on" half of a two-run experiment).
#
#   mpirun -n 12 c4-simgen -p simgen/params/param_transfunc.yml
#
# Analysed by `params/sims/simparam_transfunc.yml`.
#
# This file is a copy of `param_compsep.yml` (same seed, same sky, same scanning, same bands, same
# noise) with the bolometer transfer function switched on and nothing else changed but the output
# paths.
#
#   mpirun -n 12 c4-simgen -p simgen/params/param_compsep.yml            # TF off, the reference
#   mpirun -n 12 c4-simgen -p simgen/params/param_transfunc.yml          # TF on
#   mpirun -n 18 commander4 -p params/sims/simparam_compsep_only.yml     # reference analysis
#   mpirun -n 18 commander4 -p params/sims/simparam_transfunc.yml        # this analysis


general:
  nside: 64
  units: "uK_RJ"
  double_precision: false
  seed: 71
  output_dir: "../c4_sims/simgen_transfunc/"

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      shortname: "cmb"
      lmax: 191
      solar_dipole: false

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      shortname: "dust"
      beta: 1.54             # <- truth for the MH sampler
      T: 20
      nu_ref: 353
      lmax: 191
      template: {source: "pysm3", preset: "d0"}

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      shortname: "sync"
      beta: -3.1             # <- truth for the MH sampler
      nu_ref: 30
      lmax: 191
      template: {source: "pysm3", preset: "s5"}

simulation:
  # 2400 x 600 s = 16.7 days. The accelerated 18-day anti-Sun period sweeps 333 deg, while the
  # Planck-like 7.5 deg tilt and half-year precession ratio give dense, cross-linked scan rings.
  nscans: 2400
  scan_duration_sec: 600
  npsi: 4096
  orbital_dipole: true
  compress: true
  debug_output_dir: "../c4_sims/simgen_transfunc_debug/"

  pointing:
    strategy: "planck_scan"
    los_angle: 85.0
    spin_angle_tilt: 7.5
    spin_rate: 1.00165345964511
    anti_sun_period_days: 18.0
    precession_period_days: 9.0
    mission_start: "2009-08-13T00:00:00"

  noise:
    white: true
    oof: {enabled: false}

  modifiers:
    crosstalk: {enabled: false}

  # The feature under test.  Single-pole bolometer response H(f) = 1/(1 + 2*pi*i*f*tau),
  # DC-normalised so it changes only the temporal shape, not the calibration. 
  transfer_function:
    enabled: true
    tau_ms: 150.0  # For reference, HFI's tau is ~10 ms.

experiments:
  SimSat:
    enabled: true
    bands:
      # A common sigma0 across bands keeps the exercise about spectral separation rather than about
      # relative band weights. 2400 scans x 19500 samples x 4 detectors over 49152 pixels is about
      # 3800 hits/pixel on average; the actual Planck-like coverage is intentionally non-uniform.
      Band30GHz:
        enabled: true
        freq: 30.0
        fwhm: 120.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det30_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det30_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det30_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det30_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band44GHz:
        enabled: true
        freq: 44.0
        fwhm: 100.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det44_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det44_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det44_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det44_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band70GHz:
        enabled: true
        freq: 70.0
        fwhm: 80.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det70_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det70_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det70_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det70_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band100GHz:
        enabled: true
        freq: 100.0
        fwhm: 65.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det100_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det100_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det100_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det100_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band217GHz:
        enabled: true
        freq: 217.0
        fwhm: 50.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det217_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det217_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det217_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det217_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band353GHz:
        enabled: true
        freq: 353.0
        fwhm: 40.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det353_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det353_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det353_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det353_d: {psi_offset_deg: 135.0, gain: 1.0}
