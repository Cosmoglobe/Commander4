WMAPKa:
  enabled: true
  get_from: "file"
  eval_nside: 512
  signal_map:
    path: "/mn/stornext/d5/data/duncanwa/WMAP/data/CG_030-WMAP_Ka_map_v4.fits"
    dataset_names: ["I_Stokes", "Q_Stokes", "U_Stokes"]
