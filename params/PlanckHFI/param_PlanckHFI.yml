# Parameter file for full TOD processing and CG component separation on Planck HFI TOD data at
# native resolution.
# Includes all six HFI bands and all detectors present in the TOD files.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 20

  seed: 1995

  # start:
  #   mode: new
  #   source: "../c4_chains/HFI_test4_tod-downsamp-fix/"
  #   chain: 1
  #   iteration: latest
  #   load: [tod]

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 2

  compsep:
    num_threads: 4

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/HFI_test5/"

  logging:
    console:
      level: 'verbose'
    file:
      level: 'debug'

  profiling: False

  chains:
    write: [1,]  # Write only chain 1 to disk.
    interval:  # Write all data every iteration.
      bands: 1
      compsep: 1
      maps: 1
    maps_nside: "native"
    nside_chisq: 128

    include:
      orbital_dipole_maps: True
      corr_noise_maps: True
      sky_model_maps: True
      residual_maps: True   # maps/res: binned TOD residual (C3 tod_<freq>_res). One extra
                            # map accumulator per mapmaker.
      hit_maps: True        # maps/nhit: per-pixel count of unflagged samples.
      cov_maps: True       # maps/cov: the 6 unique elements of P^T N^-1 P, of which only the
                            # inverse diagonal survives as maps/rms. Six full-sky float64 maps.
      chisq_map: True       # chi2/map in the compsep chain (C3 chisq_<postfix>.fits).
      compsep_residual_maps: True  # residuals/<band>_<pol>: full-resolution per-band residuals
                            # (C3 res_<band>_<postfix>.fits). Gathers every band map onto the
                            # compsep master, so it is memory-heavy.
      ncorr_tods: False   # DEBUG ONLY: full per-sample n_corr TODs (very large data).
      residual_tods: True

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  # TODO: DEMODULATION:

  abs_gain:
    enabled: true
    from_iter: 1
    calibrate_against: orbital_dipole # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.5        # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  rel_gain:
    enabled: true
    from_iter: 1
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.5        # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  temporal_gain:
    enabled: false
    from_iter: 1
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.5        # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  corr_noise:
    enabled: true
    from_iter: 10
    sample_psd_params: true     # Resample noise-model params (needs corr_noise.enabled).
    sample_sigma0: True            # Re-estimate sigma0 from the n_corr-subtracted residual.
    nomono: False                 # Project the per-scan monopole out of n_corr (Fortran "nomono").
    onlymono: False               # Model the correlated noise as only the per-scan offset.
    sigma0_decimation: 1          # Block-average factor for the sigma0 estimator.
    psd_fit_nu_min: 0.0           # Min frequency (Hz) for noise-PSD parameter fitting.
    psd_fit_nu_max: 2.0           # Max frequency (Hz) for noise-PSD parameter fitting.
    psd_bin: true                 # Fit every Fourier mode (False) or mode-weighted binned PSD.
    sigma0_method: pairwise     # White-noise estimator: 'pairwise' (first-difference) or 'binned_psd'.
    use_dct: true                 # Evaluate the n_corr Fourier filters as a length-nsamp DCT
                                  # rather than the length-2*nsamp mirrored FFT. Same operator,
                                  # about half the transform cost.
    cg:
      max_iter: 100               # Max CG iterations; 0 -> skip CG, use stationary fallback.
      err_tol: 1.0e-5             # Correlated-noise CG convergence tolerance.

  # far_beam_deconvolution:
  #   enabled: True
  #   from_iter: 1
  #   lmax: 3071         # Sky and beam are truncated here before convolving (C3 uses 100).
  #   mmax: 3071         # Beam azimuthal limit; drives the cube size hardest.
  #   epsilon: 1.0e-4    # ducc0 interpolation accuracy.
  #   beam_norm: 2.0     # C3's LevelS-comparison factor on the sidelobe beams.


# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep: {}


# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      init_from: "/mn/stornext/d5/data/duncanwa/WMAP/data/COM_CMB_IQU-smica_2048_R3.00_full_uK_14amin_dip.fits"
      Cl_prior_amplitude: null  # No amplitude prior.
      lmax: 1024
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      longname: "Thermal-Dust"
      shortname: "dust"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_dust_amp_BP8.1_v1.fits"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: 1.56
      T: 20
      nu_ref: [857, 353]  # [I, QU]
      units: "uK_RJ"
      lmax: 1024
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_synch_amp_BP8.1_v1.fits"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: -3.1
      nu_ref: [0.408, 30]  # [I, QU]
      units: "uK_RJ"
      lmax: 512
      spatially_varying_MM: False

  FreeFree:
    enabled: true
    component_class: "FreeFree"
    params:
      polarization: "I"
      longname: "Free-Free"
      shortname: "ff"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_ff_amp_BP8.1_v1.fits"
      Cl_prior_amplitude: null  # No amplitude prior.
      T: 7000
      nu_ref: 40
      units: "uK_RJ"
      lmax: 512
      spatially_varying_MM: False


# ----------------------------------------
# EXPERIMENTS
# ----------------------------------------
experiments:
  PlanckHFI:
    enabled: true
    mapmaker: "bin"
    experiment_id: "planck_hfi"  # Decides expected data format, what TOD reader is used, etc.
    instrument_file: "/mn/stornext/d23/cmbco/globe/planck/rimo/HFI_instrument_v6.h5"
    filelist_idx_start: 0
    filelist_idx_stop: 26424  # Only cold-phase scans (OD 91-974), drop warm-phase scans.
    bad_data_bitmask: 767  # 767 stolen from C3. Previously used flag 515:
                           # Chunk-boundary filler (bit 0) + DPC glitches (bit 1, 100/143 GHz
                           # only) + NPIPE glitches (bit 9, all bands). Masks 10-20% of all
                           # samples. Bit 8 labels a whole chunk, not bad samples: never set it.
                           # NB: This will *mask* all glitches. In the future we want to fit them.

    bands:
      Planck100GHz:
        enabled: true
        num_tasks: 176
        eval_nside: 1024
        fwhm: 9.68 # [arcmin]
        freq: 100.0 # [GHz]
        band_unit: "uK_CMB"
        polarization: "IQU"
        processing_mask: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_100.txt"
        detectors:
          100-1a: {gain: 0.1039}
          100-1b: {gain: 0.1158}
          100-2a: {gain: 0.1399}
          100-2b: {gain: 0.1348}
          100-3a: {gain: 0.1308}
          100-3b: {gain: 0.1186}
          100-4a: {gain: 0.1382}
          100-4b: {gain: 0.1091}

      Planck143GHz:
        enabled: true
        num_tasks: 306
        eval_nside: 2048
        fwhm: 7.30 # [arcmin]
        freq: 143.0 # [GHz]
        band_unit: "uK_CMB"
        polarization: "IQU"
        processing_mask: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_143.txt"
        detectors:
          143-1a: {gain: 0.1609}
          143-1b: {gain: 0.1462}
          143-2a: {gain: 0.1599}
          143-2b: {gain: 0.1591}
          143-3a: {gain: 0.1559}
          143-3b: {gain: 0.1484}
          143-4a: {gain: 0.1493}
          143-4b: {gain: 0.1458}
          143-5: {gain: 0.2156}   # 143-5/6/7 are unpolarized SWBs (RIMO polEff 1.7-6.6%).
          143-6: {gain: 0.1794}
          143-7: {gain: 0.2050}

      Planck217GHz:
        enabled: true
        num_tasks: 364
        eval_nside: 2048
        fwhm: 5.01 # [arcmin]
        freq: 217.0 # [GHz]
        band_unit: "uK_CMB"
        polarization: "IQU"
        processing_mask: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_217.txt"
        detectors:
          217-1: {gain: 0.1077}   # 217-1/2/3/4 are unpolarized SWBs (RIMO polEff 2.1-4.1%).
          217-2: {gain: 0.1061}
          217-3: {gain: 0.1145}
          217-4: {gain: 0.1104}
          217-5a: {gain: 0.09666}
          217-5b: {gain: 0.1048}
          217-6a: {gain: 0.1080}
          217-6b: {gain: 0.1034}
          217-7a: {gain: 0.1097}
          217-7b: {gain: 0.1108}
          217-8a: {gain: 0.1072}
          217-8b: {gain: 0.1018}

      Planck353GHz:
        enabled: true
        num_tasks: 352
        eval_nside: 2048
        fwhm: 4.9 # [arcmin]
        freq: 353.0 # [GHz]
        band_unit: "uK_CMB"
        polarization: "IQU"
        processing_mask: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_353.txt"
        detectors:
          353-1: {gain: 0.05152}  # 353-1/2/7/8 are unpolarized SWBs (RIMO polEff 3.4-8.1%).
          353-2: {gain: 0.05753}
          353-3a: {gain: 0.02359}
          353-3b: {gain: 0.02575}
          353-4a: {gain: 0.02615}
          353-4b: {gain: 0.02628}
          353-5a: {gain: 0.02982}
          353-5b: {gain: 0.02988}
          353-6a: {gain: 0.01264}
          353-6b: {gain: 0.01038}
          353-7: {gain: 0.02840}
          353-8: {gain: 0.02930}

      Planck545GHz:
        enabled: true
        num_tasks: 62
        eval_nside: 2048
        fwhm: 4.8 # [arcmin]
        freq: 545.0 # [GHz]
        band_unit: "MJy/sr"  # Planck calibrates 545 and 857 in MJy/sr rather than K_CMB, and the
                             # `scalars` in the TOD files follow that convention. Gains below and
                             # the maps in the band chain are therefore in MJy/sr too.
        polarization: "I"
        # Important: Processing mask only for ncorr, not for gain, for 545 and 857,
        # which are both calibrating against the full sky, not just the orbital dipole.
        processing_masks:
          ncorr: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_545.txt"
        detectors:
          545-1: {gain: 45.62}   # All three are unpolarized SWBs (RIMO polEff 4.7-5.9%).
          545-2: {gain: 47.62}
          545-4: {gain: 44.54}
        abs_gain:
          calibrate_against: "sky"

      Planck857GHz:
        enabled: true
        num_tasks: 84
        eval_nside: 2048
        fwhm: 4.6 # [arcmin]
        freq: 857.0 # [GHz]
        band_unit: "MJy/sr"  # As for 545 GHz above.
        polarization: "I"
        # Masked for n_corr only, for the same reason as 545 GHz above.
        processing_masks:
          ncorr: "/mn/stornext/d5/data/duncanwa/WMAP/data/mask_proc_070_res_v5.fits"
        filelist: "/mn/stornext/d23/cmbco/globe/planck/tod/tod_v2/filelist_857.txt"
        detectors:
          857-1: {gain: 57.15}   # All four are unpolarized SWBs (RIMO polEff 6.3-8.6%).
          857-2: {gain: 57.37}
          857-3: {gain: 57.93}
          857-4: {gain: 43.29}
        abs_gain:
          calibrate_against: "sky"
