# Maps-only per-pixel component separation on nine pre-smoothed pySM bands.
# There is no TOD side: `experiments` is empty, so every band is read from file. The per-pixel
# solver needs one common resolution, which the input maps already carry (60' beams, nside 512),
# so no `common_res_fwhm` smoothing is applied here.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 40

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 1

  compsep:
    num_threads: 1

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/Ananya_mapsonly_perpix_test_sis2/"

  logging:
    console:
      level: 'info'
    file:
      level: 'info'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 1
    maps_nside: "native"
    include:
      orbital_dipole_maps: True
      corr_noise_maps: True
      sky_model_maps: True

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing: {}

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  # Amplitude sampling group: the per-pixel solve, over every component and every band. `all` is
  # also the default for both keys; stated so the file says what it solves for.
  per_pixel_sampling_groups:
    sample_amps_perpix:
      enabled: true
      comps: all
      bands: all

  bands:
    Planck30GHz:
      enabled: true
      get_from: "file"
      units: "uK_RJ"
      signal_map:
        path: "/mn/stornext/d23/cmbco/commander4_shared/external_data/data/pysm_CMBSynchTD_30GHz_1deg.fits"
        dataset_names: ["TEMPERATURE", "Q_POLARISATION", "U_POLARISATION"]
      rms_map:
        type: "rms"
        path: "/mn/stornext/d23/cmbco/commander4_shared/external_data/data/pysm_CMBSynchTD_30GHz_RMS.fits"
        dataset_names: ["T", "", ""]
      fwhm: 60.0 # [arcmin]
      freq: 30.0 # [GHz]
      polarization: "I"

    Planck44GHz:
      enabled: true
      get_from: "file"
      units: "uK_RJ"
      signal_map:
        path: "/mn/stornext/d23/cmbco/commander4_shared/external_data/data/pysm_CMBSynchTD_44GHz_1deg.fits"
