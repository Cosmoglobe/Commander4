# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 30

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 2

  compsep:
    num_threads: 16

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/litebird/inplacesim/"

  logging:
    console:
      level: 'verbose'
    file:
      level: 'debug'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 1
    maps_nside: 512
    include:
      orbital_dipole_maps: True
      corr_noise_maps: True
      sky_model_maps: True

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  abs_gain:
    enabled: true
    from_iter: 2

  rel_gain:
    enabled: false
    from_iter: 2

  temporal_gain:
    enabled: false
    from_iter: 2

  corr_noise:
    enabled: true
    from_iter: 2
    sample_psd_params: false
    sample_sigma0: true
    cg:
      max_iter: 60
      err_tol: 1.0e-4

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  # Amplitude sampling group: the constrained realization of every component's amplitudes, solved
  # jointly over every band. `all` is also the default for both keys; stated so the file says what
  # it solves for. The solver controls (max_iter, err_tol, preconditioner) keep their defaults.
  cg_sampling_groups:
    sample_amps_CG:
      enabled: true
      comps: all
      bands: all
      err_tol: 0.0

  bands:
    ### TOD DATA ###
    LiteBIRD40GHz_L1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD61GHz_L1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD50GHz_L2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD77GHz_L2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD94GHz_M1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD145GHz_M1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD118GHz_M2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD182GHz_M2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD217GHz_H1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD334GHz_H1:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD280GHz_H2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD402GHz_H2:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"
    LiteBIRD570GHz_H3:
      enabled: true
      get_from: "LiteBIRD"
      polarization: "IQU"

# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      Cl_prior_amplitude: null  # No amplitude prior.
      lmax: 1024
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU" #I Q U
      longname: "Thermal Dust"
      shortname: "dust"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: 1.56
      T: 20
      nu_ref: 545
      lmax: 1024
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU" #I Q U
      longname: "Synchrotron"
      shortname: "sync"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: -3.1
      nu_ref: 30
      lmax: 1024
      spatially_varying_MM: False

  FreeFree:
    enabled: false
    component_class: "FreeFree"
    params:
      polarization: "I"
      longname: "Free-Free"
      shortname: "ff"
      Cl_prior_amplitude: null  # No amplitude prior.
      T: 7000
      nu_ref: 40
      lmax: 1024
      spatially_varying_MM: False

# ----------------------------------------
# EXPERIMENTS
# ----------------------------------------
experiments:
  LiteBIRD:
    enabled: true
    pix_is_compressed: false
    psi_is_compressed: false
    mapmaker: "bin"
    experiment_id: "litebird_sim_spawndetectors"  # Decides expected data format, what TOD reader is used, etc.
    # bad_PIDs_path: "/mn/stornext/d23/cmbco/jonas/c4_testing/Commander4/badPIDs.npy"
    num_scans: 9142

    replace_tod_with_sim: true
    sim_params:
      include_CMB: True
      include_ThermalDust: True
      include_Synchrotron: True
      include_FreeFree: False
      include_SpinningDust: False
      include_OrbitalDipole: True
      include_corr_noise: True
      corr_noise_fknee: 0.1
      corr_noise_alpha: -1.0

    bands:
      LiteBIRD40GHz_L1:
        enabled: true
        num_tasks: 24
        eval_nside: 512
