# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU" #I Q U
      longname: "CMB"
      shortname: "cmb"
      Cl_prior_amplitude: null  # No amplitude prior.
      lmax: 1024
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU" #[True, True, True]
      longname: "Thermal-Dust"
      shortname: "dust"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: 1.56
      T: 20
      nu_ref: [857, 353]  # [I, QU]
      units: "uK_RJ"
      lmax: 1024
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      Cl_prior_amplitude: null  # No amplitude prior.
      beta: -3.1
      nu_ref: [0.408, 30]  # [I, QU]
      units: "uK_RJ"
      lmax: 512
      spatially_varying_MM: False

  FreeFree:
    enabled: true
    component_class: "FreeFree"
    params:
      polarization: "I"
      longname: "Free-Free"
      shortname: "ff"
      Cl_prior_amplitude: null  # No amplitude prior.
      T: 7000
      nu_ref: 40
      units: "uK_RJ"
      lmax: 512
      spatially_varying_MM: False

  RadioSources:
    enabled: False
    component_class: "RadioSources"
    params:
      polarization: "I"
      longname: "RadioSources"
      shortname: "radsources"
      template_path: "/mn/stornext/d5/data/duncanwa/WMAP/data/init_radio_BP8.11.dat"
      nu_0: 30.0  # Ghz

  SpinningDust:
    enabled: False
    component_class: "SpinningDust"
    params:
      polarization: "I"
      longname: "SpinningDust"
      shortname: "sdust"
      Cl_prior_amplitude: null  # No amplitude prior.
      template_path: "/mn/stornext/d5/data/duncanwa/WMAP/data/spdust2_cnm.dat"
      nu_peak: 25.3  # Ghz
      nu_0: 22.0  # Ghz
      lmax: 1000
      spatially_varying_MM: False

