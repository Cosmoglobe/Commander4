# Parameter file for performing a full TOD processing + CG compsep on the Planck LFI TOD data with
# auxiliary maps (Haslam + WMAP + HFI). Analysis performed at native resolutions.
# By default not all detectors are included, but they are just commented out.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 10

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 12

  compsep:
    num_threads: 2

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/PlanckTODs_CG/"

  logging:
    console:
      level: 'info'
    file:
      level: 'info'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 1
    maps_nside: "native"
    include:
      orbital_dipole_maps: True
      corr_noise_maps: True
      sky_model_maps: True
      ncorr_tods: False   # DEBUG ONLY: full per-sample n_corr TODs (very large data).

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  cg_mapmaker:
    max_iter: 10
    err_tol: 1.0e-10

  abs_gain:
    enabled: true
    from_iter: 2
    calibrate_against: orbital_dipole # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 1.0   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  rel_gain:
    enabled: true
    from_iter: 4
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 1.0   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  temporal_gain:
    enabled: true
    from_iter: 4
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: wn         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 1.0   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  corr_noise:
    enabled: True
    from_iter: 8
    sample_psd_params: True     # Resample noise-model params (needs corr_noise.enabled).
    sample_sigma0: True            # Re-estimate sigma0 from the n_corr-subtracted residual.
    nomono: False                 # Project the per-scan monopole out of n_corr (Fortran "nomono").
    onlymono: False               # Model the correlated noise as only the per-scan offset.
    sigma0_decimation: 1          # Block-average factor for the sigma0 estimator.
    psd_fit_nu_min: 0.0           # Min frequency (Hz) for noise-PSD parameter fitting.
    psd_fit_nu_max: 2.0           # Max frequency (Hz) for noise-PSD parameter fitting.
    psd_bin: False                # Fit every Fourier mode (False) or mode-weighted binned PSD.
    sigma0_method: pairwise     # White-noise estimator: 'pairwise' (first-difference) or 'binned_psd'.
    cg:
      max_iter: 60                # Max CG iterations; 0 -> skip CG, use stationary fallback.
      err_tol: 1.0e-4             # Correlated-noise CG convergence tolerance.

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  # Amplitude sampling group: the constrained realization of every component's amplitudes, solved
  # jointly over every band. `all` is also the default for both keys; stated so the file says what
  # it solves for. The solver controls (max_iter, err_tol, preconditioner) keep their defaults.
  cg_sampling_groups:
    sample_amps_CG:
      enabled: true
      comps: all
      bands: all
      err_tol: 0.0

  bands:
    ### TOD BANDS ###
    AkariN60:
      get_from: Akari
      enabled: true
      polarization: "I"
    Planck30GHz:
      get_from: PlanckLFI
      enabled: false
      polarization: "IQU"
    Planck44GHz:
      get_from: PlanckLFI
      enabled: false
      polarization: "IQU"
    Planck70GHz:
      get_from: PlanckLFI
      enabled: false
      polarization: "IQU"

    ### TOTAL INTENSITY MAPS ###
    Haslam408MHz:
      enabled: false
      get_from: "file"
      eval_nside: 512
      signal_map:
        path: "/mn/stornext/d16/cmbco/archive/bp/delivery/BP_releases/input/auxcmd3/haslam_n0512_60arcmin_uK.fits"
        dataset_names: ["TEMPERATURE", "Q-POLARISATION", "U-POLARISATION"]
      rms_map:
        type: "rms"
        path: "/mn/stornext/d16/cmbco/archive/bp/delivery/BP_releases/input/auxcmd3/haslam_rms_n0512_60arcmin_uK_1pct_0.8K.fits"
        dataset_names: ["TEMPERATURE", "Q-POLARISATION", "U-POLARISATION"]
      fwhm: 60.0  # [arcmin]
      freq: 0.408 # [GHz]
      polarization: "IQU"
      units: "uK_CMB"

