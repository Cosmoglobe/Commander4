# Commander4: partial-sky / sparse-map + amplitude-prior-mean feature test.
#
# Analyses `simgen/params/param_patch.yml`, which describes the simulation.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 12

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 1

  compsep:
    num_threads: 1

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/simgen_patch/"

  logging:
    console:
      level: 'info'
    file:
      level: 'info'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 3
    maps_nside: 128
    include:
      orbital_dipole_maps: False
      corr_noise_maps: True
      sky_model_maps: True

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  cg_mapmaker:
    max_iter: 10
    err_tol: 1.0e-10

  abs_gain:
    enabled: false           # A patch experiment sees no orbital dipole, so there is no absolute
    from_iter: 2 # calibrator in this simulation.
    gap_fill_method: wn
    downsample_time: 1.0

  rel_gain:
    enabled: false
    from_iter: 3
    gap_fill_method: wn
    downsample_time: 1.0

  temporal_gain:
    enabled: false
    from_iter: 4
    gap_fill_method: wn
    downsample_time: 1.0

  corr_noise:
    enabled: True
    # Iteration 1 runs against the initial (zero) sky model; wait for component separation to
    # produce one before letting n_corr near the residual.
    from_iter: 3
    sample_psd_params: True
    sample_sigma0: True
    nomono: False
    onlymono: False
    sigma0_decimation: 1
    psd_fit_nu_min: 0.0
    psd_fit_nu_max: 15.0    # Nyquist is 15 Hz at fsamp = 30.
    psd_bin: False
    sigma0_method: pairwise
    cg:
      max_iter: 60
      err_tol: 1.0e-5

  data_selection:
    enabled: true
    from_iter: 4
    chisq_abs_threshold: 1.0e+4
    min_good_fraction: 0.1

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  cg_sampling_groups:
    sample_amps_CG:
      enabled: true
      comps: [CMB, Synchrotron, ThermalDust]
      bands: [Band90GHz, Band150GHz, Band220GHz]
      optimize: false   # was compsep.sample_amplitudes: true
      max_iter: 300
      max_iter_pol: 300
      err_tol: 0.0
      preconditioner: JointPreconditioner
      dense_matrix_debug_mode: false

  mcmc_sampling_groups: {}

  bands:
    Band90GHz:
      get_from: PatchTel
      enabled: true
      polarization: "IQU"
    Band150GHz:
      get_from: PatchTel
      enabled: true
      polarization: "IQU"
    Band220GHz:
      get_from: PatchTel
      enabled: true
      polarization: "IQU"

# ----------------------------------------
# COMPONENTS
# ----------------------------------------
# Three bands and three components: exactly determined, and only over the patch.  Synchrotron is
# barely constrained by 90-220 GHz, which is deliberate -- it is the component whose behaviour
# outside the patch exposes whether the prior roof is doing its job.  Spectral parameters equal the
# simulated truth.
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      Cl_prior_amplitude: [1.0e+6, 1.0e+4]  # D_l at l_pivot [I, QU]; uK_RJ^2 (~uK_CMB^2 at 1 GHz)
      Cl_prior_beta: [0.0, -0.5]
      Cl_prior_l_pivot: 20
      lmax: 383
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      longname: "Thermal-Dust"
      shortname: "dust"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: 10.0                   # arcmin; tames the l ~ 380 modes the 30' beams miss
      beta: 1.54
      T: 20
      nu_ref: 353
      units: "uK_RJ"
      lmax: 383
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: 30.0                   # arcmin
      beta: -3.1
      nu_ref: 30
      # The mean mu of the Gaussian amplitude prior a ~ N(mu, S), C3's COMP_AMP_PRIOR_MAP. Absent,
      # mu is zero and the S^-1/2 mu term in the CG right-hand side is short-circuited entirely, so
      # this is the only place that path runs. A patch is where it shows: outside the observed sky
      # the solution is set purely by the prior, so it must relax to mu there rather than to zero.
      # Set to the simulation's own truth map, which makes this a plumbing test (a mu equal to the
      # truth cannot bias the answer) rather than a statement about how the prior is weighted.
      amp_prior_mean_map: "../c4_sims/simgen_patch_debug/truth_Synchrotron.fits"
      units: "uK_RJ"
      lmax: 383
      spatially_varying_MM: False

# ----------------------------------------
# EXPERIMENTS
# ----------------------------------------
experiments:
  PatchTel:
    enabled: true
    experiment_id: "general"
    mapmaker: "bin"
    sparse_maps: true              # The feature under test; flip to false for the comparison run.
    num_scans: 60
    bands:
      Band90GHz:
        enabled: true
        num_tasks: 2
        eval_nside: 128
        fwhm: 70.0
        freq: 90.0
        fsamp: 30.0
        band_unit: "uK_RJ"
        polarization: "IQU"
        # [sigma0, fknee, alpha]; sigma0 is the injected truth, fknee/alpha start off it
        # (truth 0.2 and -1.2) so the PSD sampler has to move.
        initial_noise_params: [200.0, 0.05, -1.0]
        filelist: "../c4_sims/simgen_patch/Band90GHz/filelist.txt"
        detectors:
          det90_a: {gain: 1.0}
          det90_b: {gain: 1.0}
          det90_c: {gain: 1.0}
          det90_d: {gain: 1.0}

      Band150GHz:
        enabled: true
        num_tasks: 2
        eval_nside: 128
        fwhm: 45.0
        freq: 150.0
        fsamp: 30.0
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [200.0, 0.05, -1.0]
        filelist: "../c4_sims/simgen_patch/Band150GHz/filelist.txt"
        detectors:
          det150_a: {gain: 1.0}
          det150_b: {gain: 1.0}
          det150_c: {gain: 1.0}
          det150_d: {gain: 1.0}

      Band220GHz:
        enabled: true
        num_tasks: 2
        eval_nside: 128
        fwhm: 30.0
        freq: 220.0
        fsamp: 30.0
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [400.0, 0.05, -1.0]
        filelist: "../c4_sims/simgen_patch/Band220GHz/filelist.txt"
        detectors:
          det220_a: {gain: 1.0}
          det220_b: {gain: 1.0}
          det220_c: {gain: 1.0}
          det220_d: {gain: 1.0}
