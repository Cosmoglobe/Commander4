# Commander4: per-pixel amplitude solver + common-resolution smoothing feature test.
#
# Analyses `sims/simgen/params/param_common_res.yml`, which describes the simulation and the truth
# it injects. Generate the TODs first, then run this:
#     cd sims && mpirun -n 8 python -m simgen -p simgen/params/param_common_res.yml
#     cd ..   && mpirun -n 12 commander4 -p params/sims/simparam_compsep_perpix.yml
# 12 tasks = 4 TOD + 4 CompSep-I + 4 CompSep-QU.
#
# FEATURES UNDER TEST, neither of which any other file here reaches:
#   * `compsep.per_pixel_sampling_groups`, the per-pixel least-squares amplitude solver in
#     `compsep/perpix_solver.py`. It is the alternative to the global CG solve and is mutually
#     exclusive with it, so `cg_sampling_groups` is empty below.
#   * `compsep.common_res_fwhm`, the noise-weighted smoothing of every band to one beam, applied at
#     the data sources on read (`data_models/detector_map.py`). The per-pixel solver has no beam
#     model at all, so without this it would silently mix resolutions.
#
# The two go together: the per-pixel solver is only correct once all bands share a beam. The
# simulation's beams span 100' to 30', a factor 3.3, so the smoothing is a large operation rather
# than a rounding correction, and `common_res_fwhm` is set to the broadest of them.
#
# Unlike the CG solver, the per-pixel solver returns amplitudes *at* the common resolution rather
# than deconvolved, so the recovered maps must be compared against the simulation's truth maps
# smoothed to 100', not against the truth maps directly. The chain records which of the two a file
# holds: `comps/<name>/amp_fwhm_arcmin` is 100 here and 0 for a deconvolved CG solve.
#
# It also reads the point-source catalogue simgen writes, as a component held fixed at the
# catalogue values (see the `RadioSources` block). That is the only place a point-source component
# can go today: `perpix_solver.py` rejects non-diffuse components and the CG path for them is
# unfinished, but a fixed component is still projected into every band and subtracted before the
# solve, which is all that is needed to keep the sources out of the fitted components.
#
# WHAT TO CHECK:
#   * The component maps in `<output_dir>/chains_compsep/` against `truth_<Component>.fits` from the
#     simulation, smoothed to 100'. Measured: recovered-vs-truth slope 0.98-1.00 and correlation
#     0.97-0.99 for all three diffuse components.
#   * That the point sources stay out of the CMB. Correlate the CMB residual against
#     `truth_PointSources.fits` smoothed to 100': it is ~0.00 with the `RadioSources` block below
#     and +0.55 without it, and the residual inside the source discs goes 6.6 -> 35 uK_RJ.
#   * `map_observed_sky - map_skymodel` in `<output_dir>/chains_datamaps/`, against `map_rms`.
#     Both maps are at the beam named by `metadata/map_fwhm_arcmin` (100' here, since
#     `common_res_fwhm` is set), so the residual is meaningful as it stands. Measured: 1.0-2.8.
#   * Run the same simulation through `simparam_compsep_CG.yml`'s solver settings and compare. At
#     common resolution the per-pixel and CG solutions should agree where the data constrain them;
#     a disagreement that tracks the beam spread is a smoothing bug.
#   * The startup warning from `solve_compsep_perpix` if the bands reach it at different
#     resolutions. It must not fire here, and firing means `common_res_fwhm` was ignored.
#
# KNOWN, NOT A BUG: the reduced chi^2 sits near 1.7 rather than 1.0. The common-resolution
# smoothing correlates the noise between neighbouring pixels, and only a per-pixel rms is carried
# through it, so the chi^2 is not properly normalized. It scales with how much smoothing is
# applied: 1.65 at common_res_fwhm 100', 1.80 at 110', 3.04 at 150' (point sources excluded in all
# three). Fixing it needs a noise model that survives smoothing, not a change to this file.

gibbs:
  num_iterations: 10
  seed: 1995

resources:
  tod:
    num_threads: 1
  compsep:
    num_threads: 1

output:
  dir: "../cmdr4_chains/simgen_compsep_perpix/"
  logging:
    console:
      level: 'info'
    file:
      level: 'info'
      filename: 'simgen_compsep_perpix.log'
  profiling: False
  chains:
    write: [1,]
    interval:
      tod: 1
      compsep: 1
      datamaps: 2
    maps_nside: 128
    include:
      orbital_dipole_maps: False
      corr_noise_maps: False
      sky_model_maps: True

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      Cl_prior_amplitude: [1.0e+6, 1.0e+4]  # D_l at l_pivot [I, QU]; uK_RJ^2 (~uK_CMB^2 at 1 GHz)
      Cl_prior_beta: [0.0, -0.5]
      Cl_prior_l_pivot: 20
      units: "uK_RJ"
      lmax: 383
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      longname: "Thermal-Dust"
      shortname: "dust"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      beta: 1.54                            # simulated truth
      T: 20
      nu_ref: 353
      units: "uK_RJ"
      lmax: 383
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: 30.0                   # arcmin
      beta: -3.1                            # simulated truth
      nu_ref: 30
      units: "uK_RJ"
      lmax: 383
      spatially_varying_MM: False

  # The 72 gridded sources the simulation injects, read from the catalogue simgen writes next to
  # its truth maps. HELD FIXED AT THE CATALOGUE VALUES: this component appears in no sampling
  # group, because neither solver can sample point-source amplitudes yet (the per-pixel solver
  # rejects non-diffuse components outright, and `RadioSources.apply_Cl_prior_sqrt` documents the
  # CG path as unfinished). A fixed component is still projected into every band and subtracted
  # from the data before the active solve, which is the point: without it the sources have no
  # component to live in and leak into the CMB, whose residual then correlates with them at ~0.55.
  # `nu_0` must match the `Reference frequency` in the catalogue header.
  RadioSources:
    enabled: true
    component_class: "RadioSources"
    params:
      polarization: "I"
      longname: "RadioSources"
      shortname: "radsources"
      template_path: "../c4_sims/simgen_common_res_debug/catalogue_PointSources.dat"
      nu_0: 100.0             # GHz; the catalogue's reference frequency

experiments:
  SimSat:
    enabled: true
    experiment_id: "general"
    mapmaker: "bin"
    num_scans: 400
    bands:
      # The band FWHMs must match the simulation's: they are what `common_res_fwhm` smooths from.
      Band30GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 128
        data_nside: 128
        fwhm: 100.0
        freq: 30.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_common_res/Band30GHz/filelist.txt"
        detectors:
          det30_a: {gain: 1.0}
          det30_b: {gain: 1.0}
          det30_c: {gain: 1.0}
          det30_d: {gain: 1.0}

      Band100GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 128
        data_nside: 128
        fwhm: 70.0
        freq: 100.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_common_res/Band100GHz/filelist.txt"
        detectors:
          det100_a: {gain: 1.0}
          det100_b: {gain: 1.0}
          det100_c: {gain: 1.0}
          det100_d: {gain: 1.0}

      Band217GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 128
        data_nside: 128
        fwhm: 45.0
        freq: 217.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_common_res/Band217GHz/filelist.txt"
        detectors:
          det217_a: {gain: 1.0}
          det217_b: {gain: 1.0}
          det217_c: {gain: 1.0}
          det217_d: {gain: 1.0}

      Band353GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 128
        data_nside: 128
        fwhm: 30.0
        freq: 353.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_common_res/Band353GHz/filelist.txt"
        detectors:
          det353_a: {gain: 1.0}
          det353_b: {gain: 1.0}
          det353_c: {gain: 1.0}
          det353_d: {gain: 1.0}

tod_processing:
  cg_mapmaker:
    max_iter: 10
    err_tol: 1.0e-10
  abs_gain:
    enabled: false
    from_iter: 2
    gap_fill_method: wn
    downsample_time: 1.0
  rel_gain:
    enabled: false
    from_iter: 3
    gap_fill_method: wn
    downsample_time: 1.0
  temporal_gain:
    enabled: false
    from_iter: 4
    gap_fill_method: wn
    downsample_time: 1.0
  corr_noise:
    enabled: False
    from_iter: 1
    sample_psd_params: False
    sample_sigma0: True
    nomono: False
    onlymono: False
    sigma0_decimation: 1
    psd_fit_nu_min: 0.0
    psd_fit_nu_max: 2.0
    psd_bin: False
    sigma0_method: pairwise
    cg:
      max_iter: 60
      err_tol: 1.0e-4
  data_selection:
    enabled: false

compsep:
  nside: 128
  float_precision: "single"
  # Must be at least the broadest band beam (100' at 30 GHz). Every band is smoothed to this on
  # read, which is what makes the beam-free per-pixel solver valid.
  common_res_fwhm: 100.0

  bands:
    Band30GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band100GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band217GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band353GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"

  # Mutually exclusive with `cg_sampling_groups`, which is why that block is empty.
  cg_sampling_groups: {}
  per_pixel_sampling_groups:
    sample_amps_perpix:
      enabled: true
      comps: [CMB, Synchrotron, ThermalDust]
      bands: [Band30GHz, Band100GHz, Band217GHz, Band353GHz]
  mcmc_sampling_groups: {}
