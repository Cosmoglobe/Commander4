# Commander4: per-pixel amplitude solver on the same simulation as the CG amplitude test.
# Analyses `simgen/params/param_compsep.yml`; no separate per-pixel simulation is needed because
# `compsep.common_res_fwhm` brings the six native-resolution band maps to one common beam.
#
# 18 tasks = 6 TOD + 6 CompSep-I + 6 CompSep-QU.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 10

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 1

  compsep:
    num_threads: 1

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  dir: "../c4_chains/simgen_compsep_only_perpix/"

  logging:
    console:
      level: 'info'
    file:
      level: 'info'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 2
    maps_nside: 64
    include:
      orbital_dipole_maps: False
      corr_noise_maps: False
      sky_model_maps: True

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  cg_mapmaker:
    max_iter: 10
    err_tol: 1.0e-10

  abs_gain:
    enabled: false
    from_iter: 2
    gap_fill_method: wn
    downsample_time: 1.0

  rel_gain:
    enabled: false
    from_iter: 3
    gap_fill_method: wn
    downsample_time: 1.0

  temporal_gain:
    enabled: false
    from_iter: 4
    gap_fill_method: wn
    downsample_time: 1.0

  corr_noise:
    enabled: False
    from_iter: 1
    sample_psd_params: False
    sample_sigma0: True
    nomono: False
    onlymono: False
    sigma0_decimation: 1
    psd_fit_nu_min: 0.0
    psd_fit_nu_max: 2.0
    psd_bin: False
    sigma0_method: pairwise
    cg:
      max_iter: 60
      err_tol: 1.0e-4

  data_selection:
    enabled: false

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  # Must be at least the broadest band beam (120' at 30 GHz). Every band is smoothed to this on
  # read, which is what makes the beam-free per-pixel solver valid.
  common_res_fwhm: 120.0

  # Mutually exclusive with `cg_sampling_groups`, which is why that block is empty.
  cg_sampling_groups: {}

  per_pixel_sampling_groups:
    sample_amps_perpix:
      enabled: true
      comps: [CMB, Synchrotron, ThermalDust]
      bands: [Band30GHz, Band44GHz, Band70GHz, Band100GHz, Band217GHz, Band353GHz]

  mcmc_sampling_groups: {}

  bands:
    Band30GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band44GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band70GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band100GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band217GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"
    Band353GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"

# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      Cl_prior_amplitude: [1.0e+6, 1.0e+4]  # D_l at l_pivot [I, QU]; uK_RJ^2 (~uK_CMB^2 at 1 GHz)
      Cl_prior_beta: [0.0, -0.5]
      Cl_prior_l_pivot: 20
      units: "uK_RJ"
      lmax: 191
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      longname: "Thermal-Dust"
      shortname: "dust"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      beta: 1.54                            # simulated truth
      T: 20
      nu_ref: 353
      units: "uK_RJ"
      lmax: 191
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      Cl_prior_amplitude: [1.0e+8, 1.0e+6]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: 30.0                   # arcmin
      beta: -3.1                            # simulated truth
      nu_ref: 30
      units: "uK_RJ"
      lmax: 191
      spatially_varying_MM: False

# ----------------------------------------
# EXPERIMENTS
# ----------------------------------------
experiments:
  SimSat:
    enabled: true
    experiment_id: "general"
    mapmaker: "bin"
    num_scans: 2400
    bands:
      # The band FWHMs must match the simulation's: they are what `common_res_fwhm` smooths from.
      Band30GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 64
        fwhm: 120.0
        freq: 30.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_compsep/Band30GHz/filelist.txt"
        detectors:
          det30_a: {gain: 1.0}
          det30_b: {gain: 1.0}
          det30_c: {gain: 1.0}
          det30_d: {gain: 1.0}

      Band44GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 64
        fwhm: 100.0
        freq: 44.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_compsep/Band44GHz/filelist.txt"
        detectors:
          det44_a: {gain: 1.0}
          det44_b: {gain: 1.0}
          det44_c: {gain: 1.0}
          det44_d: {gain: 1.0}

      Band70GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 64
        fwhm: 80.0
        freq: 70.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_compsep/Band70GHz/filelist.txt"
        detectors:
          det70_a: {gain: 1.0}
          det70_b: {gain: 1.0}
          det70_c: {gain: 1.0}
          det70_d: {gain: 1.0}

      Band100GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 64
        fwhm: 65.0
        freq: 100.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_compsep/Band100GHz/filelist.txt"
        detectors:
          det100_a: {gain: 1.0}
          det100_b: {gain: 1.0}
          det100_c: {gain: 1.0}
          det100_d: {gain: 1.0}

      Band217GHz:
        enabled: true
        num_tasks: 1
        eval_nside: 64
        fwhm: 50.0
        freq: 217.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        initial_noise_params: [60.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_compsep/Band217GHz/filelist.txt"
        detectors:
