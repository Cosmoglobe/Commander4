# Commander4: correlated-noise / noise-PSD feature test.
#
# Analyses `simgen/params/param_corrnoise.yml`, which describes the simulation.

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 15           # The PSD parameters are sampled, not solved; give the chain room.

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 1

  compsep:
    num_threads: 1

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/simgen_corrnoise/"

  logging:
    console:
      level: 'info'
    file:
      level: 'info'

  profiling: False

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 3
    maps_nside: 64
    include:
      orbital_dipole_maps: False
      corr_noise_maps: True    # The point of the test.
      sky_model_maps: True
      ncorr_tods: False        # DEBUG ONLY: full per-sample n_corr TODs (very large).

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  cg_mapmaker:
    max_iter: 10
    err_tol: 1.0e-10

  abs_gain:
    enabled: false
    from_iter: 2
    gap_fill_method: wn
    downsample_time: 1.0

  rel_gain:
    enabled: false
    from_iter: 3
    gap_fill_method: wn
    downsample_time: 1.0

  temporal_gain:
    enabled: false
    from_iter: 4
    gap_fill_method: wn
    downsample_time: 1.0

  corr_noise:
    enabled: True
    # Iteration 1's TOD step runs against the *initial* sky model, which would be zero without an
    # `init_from` -- and n_corr would happily absorb the whole sky.  The CMB component below starts
    # from the simulation's own truth map, so the residual is pure noise from the first iteration.
    from_iter: 1
    sample_psd_params: True            # Sample fknee and alpha (needs corr_noise.enabled).
    sample_sigma0: True                  # Re-estimate sigma0 from the n_corr-subtracted residual.
    nomono: False                        # Try `onlymono: True` to compare against the
    onlymono: False                      # offset-only correlated-noise model.
    sigma0_decimation: 1
    psd_fit_nu_min: 0.0                  # Fit the full band; the injected PSD is valid everywhere.
    psd_fit_nu_max: 16.0                 # Nyquist is 16.25 Hz at fsamp = 32.5.
    psd_bin: False                       # Fit every Fourier mode rather than a binned PSD.
    sigma0_method: pairwise
    cg:
      max_iter: 60
      err_tol: 1.0e-6                   # Tight: the n_corr solve is the object of the test.

  # Data selection is enabled but with catastrophic-only thresholds, so it acts purely as a
  # diagnostic here: the per-band summary reports the chisq_z quantiles, which are a direct
  # measure of how well the sampled noise model whitens the residual.  They should sit near
  # N(0,1) once the PSD parameters have converged.
  data_selection:
    enabled: true
    from_iter: 2          # chisq_z needs the n_corr-subtracted residual, so not before n_corr.
    chisq_abs_threshold: 1.0e+4
    min_good_fraction: 0.1

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  cg_sampling_groups:
    sample_amps_CG:
      enabled: true
      comps: [CMB]
      bands: [Band100GHz]
      optimize: false   # was compsep.sample_amplitudes: true
      max_iter: 200
      max_iter_pol: 200
      err_tol: 0.0
      preconditioner: JointPreconditioner
      dense_matrix_debug_mode: false

  mcmc_sampling_groups: {}

  bands:
    Band100GHz:
      get_from: SimSat
      enabled: true
      polarization: "IQU"

# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      # Start the chain at the simulated sky, so the very first TOD iteration already has the right
      # sky model and n_corr never sees an unsubtracted signal.  This is simgen's component truth
      # map: the input amplitude at nu_ref (1 GHz for the CMB) in uK_RJ, so `units` is the identity.
      init_from: "../c4_sims/simgen_corrnoise_debug/truth_CMB.fits"
      units: "uK_RJ"
      Cl_prior_amplitude: [1.0e+6, 1.0e+4]  # D_l at l_pivot [I, QU]; a loose roof, not a fit prior.
      Cl_prior_beta: [0.0, -0.5]
      Cl_prior_l_pivot: 20
      lmax: 191
      spatially_varying_MM: False

# ----------------------------------------
# EXPERIMENTS
# ----------------------------------------
experiments:
  SimSat:
    enabled: true
    experiment_id: "general"
    mapmaker: "bin"
    num_scans: 2400
    bands:
      Band100GHz:
        enabled: true
        num_tasks: 4
        eval_nside: 64
        fwhm: 50.0
        freq: 100.0
        fsamp: 32.5
        band_unit: "uK_RJ"
        polarization: "IQU"
        # [sigma0, fknee, alpha].  sigma0 is the injected truth; fknee and alpha are deliberately
        # wrong (truth 0.5 and -1.5) so the PSD sampler has to recover them.
        initial_noise_params: [80.0, 0.1, -1.0]
        filelist: "../c4_sims/simgen_corrnoise/Band100GHz/filelist.txt"
        detectors:
          det100_a: {gain: 1.0}
          det100_b: {gain: 1.0}
          det100_c: {gain: 1.0}
          det100_d: {gain: 1.0}
