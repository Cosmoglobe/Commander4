# Commander4: SO SAT (satp3) deep patch, CG component separation.
#
# Data: /mn/stornext/d5/data/sigurdkn/cosmoglobe/so/out_sat3_deep/, 1357 scan files covering
# seven wafers (ws0-ws6) x two frequencies (f090, f150). Detector names carry a per-wafer prefix
# (Mv5, Mv27, Mv35, Mv12, Mv23, Mv33, Mv17) and the frequency, so no band can span either: every
# (wafer, frequency) pair is its own band, with its own gains and noise parameters.
#
# The detector lists (`detectors_SAT/detectors_<ws>_<freq>.yml`) and the filelists were generated
# from the files themselves. Each list holds the detectors that are live (non-zero response) in at
# least one scan of that band and present in every scan of it (roughly half the entries in the
# files are dead detectors whose TOD is identically zero and whose flags are all-bad, and listing
# them would only mean reading and discarding them on every scan). (ws1.f150 is the one band whose
# detector list is not identical across scans: 12 of its 51 scans carry 9 extra detectors, which
# are excluded because the reader looks every configured detector up in every file.)

# ----------------------------------------
# GIBBS
# ----------------------------------------
gibbs:
  num_iterations: 20

  seed: 1995

# ----------------------------------------
# RESOURCES
# ----------------------------------------
resources:
  tod:
    num_threads: 2

  compsep:
    num_threads: 8

# ----------------------------------------
# OUTPUT
# ----------------------------------------
output:
  # All output goes here, in the subdirectories logs/, chains_bands/,
  # chains_compsep/ and plots/.
  dir: "../c4_chains/SO_SAT/sat3_nside1024_f090+f150/"

  logging:
    console:
      level: 'verbose'
    file:
      level: 'debug'

  profiling: True

  chains:
    write: [1,]
    interval:
      bands: 1
      compsep: 1
      maps: 1
    maps_nside: "native"
    include:
      orbital_dipole_maps: False
      corr_noise_maps: True
      sky_model_maps: True
      ncorr_tods: False   # DEBUG ONLY: full per-sample n_corr TODs (very large data).
      residual_maps: true
      compsep_residual_maps: true
      chisq_map: true

# ----------------------------------------
# TOD PROCESSING
# ----------------------------------------
tod_processing:
  jump_detection:  # Unsure if SAT has a gain flag.
    enabled: false

  abs_gain:
    enabled: false
    from_iter: 3
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: fallback         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.1   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  rel_gain:
    enabled: false
    from_iter: 3
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: fallback         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.1   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  temporal_gain:
    enabled: false
    from_iter: 3
    calibrate_against: sky       # "orbital_dipole" | "sky" | "sky_no_dipole"; per-band overridable.
    gap_fill_method: fallback         # Gap fill for this gain step: 'wn' | 'fallback' | 'full_cg'.
    downsample_time: 0.1   # [s] Averaging chunk duration for gain-calibration TODs (0 = off).

  corr_noise:
    enabled: True
    from_iter: 1
    sample_psd_params: True     # Resample the noise-model parameters (needs corr_noise.enabled).
    sample_sigma0: True           # Re-estimate sigma0 from the n_corr-subtracted residual.
    nomono: False                 # Project the per-scan monopole out of n_corr (Fortran "nomono").
    onlymono: False               # Model the correlated noise as only the per-scan offset.
    sigma0_decimation: 1          # Block-average factor for the sigma0 estimator.
    psd_fit_nu_min: 0.02          # Min frequency (Hz) for noise-PSD parameter fitting.
    psd_fit_nu_max: 2.0           # Max frequency (Hz). These files are sampled at ~4.2 Hz, so
                                  # Nyquist is ~2.1 Hz and the LAT's 10 Hz would be out of band.
    psd_bin: true                 # Fit every Fourier mode (False) or a mode-weighted binned PSD.
    sigma0_method: pairwise     # White-noise estimator: 'pairwise' (first-difference) or 'binned_psd'.
    cg:
      max_iter: 50
      err_tol: 1.0e-5            # Correlated-noise CG convergence tolerance.

  # The SO reader keeps a detector-scan that has as little as one unflagged sample, and some of
  # these scans are ~99.5% flagged. The sigma0 estimator returns inf when it cannot find two
  # adjacent valid samples (sigma0.py), and an infinite sigma0 makes the correlated-noise CG divide
  # by zero and produce a NaN n_corr; because
  # the gain solve sums s^T N^-1 s over the whole band with MPI, a handful of such detector-scans
  # turn the band-wide sum into NaN and the absolute gain is silently not updated. Vetoing them on
  # good_fraction before the noise sampler ever sees them removes the problem at the source.
  # Measured on ws4_f090: 9 of 7545 detector-scans had sigma0 = inf at good_fraction ~ 0.005.
  data_selection:
    enabled: true
    from_iter: 1
    chisq_abs_threshold: 1.0e+4   # catastrophic-only; the real cut here is min_good_fraction
    min_good_fraction: 0.1

# ----------------------------------------
# COMPONENT SEPARATION
# ----------------------------------------
compsep:
  double_precision: false

  cg_sampling_groups:
    sample_amps_CG:
      enabled: true
      optimize: false
      max_iter: 240
      max_iter_pol: 120
      err_tol: 0.0
      preconditioner: JointPreconditioner #NoiseOnlyPreconditioner #FullPreconditioner #MixingMatrixPreconditioner #BeamOnlyPreconditioner #
      dense_matrix_debug_mode: false  # Solve system first with dense matrix math, for debugging CG. Very slow for nside>32.

  bands:
    ### TOD BANDS ###
    SO_SAT_ws0_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws0_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws1_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws1_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws2_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws2_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws3_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws3_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws4_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws4_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws5_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws5_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws6_f090:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    SO_SAT_ws6_f150:
      get_from: SO_SAT
      enabled: true
      polarization: "IQU"

    ###### HASLAM MAPS ######
    Haslam408MHz:
      enabled: true
      get_from: "file"
      eval_nside: 1024
      signal_map:
        path: "/mn/stornext/d16/cmbco/archive/bp/delivery/BP_releases/input/auxcmd3/haslam_n0512_60arcmin_uK.fits"
        dataset_names: ["TEMPERATURE", "Q-POLARISATION", "U-POLARISATION"]
      rms_map:
        type: "rms"
        path: "/mn/stornext/d16/cmbco/archive/bp/delivery/BP_releases/input/auxcmd3/haslam_rms_n0512_60arcmin_uK_1pct_0.8K.fits"
        dataset_names: ["TEMPERATURE", "Q-POLARISATION", "U-POLARISATION"]
      fwhm: 60.0  # [arcmin]
      freq: 0.408 # [GHz]
      polarization: "IQU"
      units: "uK_CMB"

    ###### WMAP MAPS ######
    !import "../Planck_mapsonly/maps_WMAP.yml"

    ###### LFI MAPS ######
    !import "../Planck_mapsonly/maps_LFI.yml"

    ###### HFI MAPS ######
    !import "../Planck_mapsonly/maps_HFI.yml"


# ----------------------------------------
# COMPONENTS
# ----------------------------------------
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      longname: "CMB"
      shortname: "cmb"
      init_from: "/mn/stornext/d23/cmbco/globe/planck/maps/map_planck_100-1_npipe_02048_fullres_full_T.fits"
      units: "uK_CMB"
      # C(l) prior, C3-equivalent 'power_law_gauss' defined in D_l space (see P_Cl_prior):
      #   D_l = amplitude*(l/l_pivot)^beta * max(exp(-l(l+1)sigma^2), 1e-10),  C_l = 2pi*D_l/(l(l+1)).
      # Each entry may be a scalar or an [I, QU] pair. BP8.1 CMB values: a flat D_l roof of
      # 1e6 uK^2 in T (>~1e4 x the real CMB everywhere, so negligible shrinkage where data
      # constrain) which falls as l^-2 in C_l — this tames the high-l modes that only the SO patch
      # constrains: outside the patch they are pulled towards zero instead of blowing up. QU
      # amplitude raised 10x over BP's 1e3 (which was tuned for lmax=2000) to keep the EE Wiener
      # weight ~1 out to l~4000 given SO's noise.
      Cl_prior_amplitude: [1.0e+6, 1.0e+4]  # D_l at l_pivot [I, QU]; uK_RJ^2 (~uK_CMB^2 at 1 GHz)
      Cl_prior_beta: [0.0, -0.5]
      Cl_prior_l_pivot: 20
      Cl_prior_FWHM: 2.0  # arcmin; optional Gaussian rolloff of D_l, 0 = off
      lmax: 1500
      spatially_varying_MM: False

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      longname: "Thermal-Dust"
      shortname: "dust"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_dust_amp_BP8.1_v1.fits"
      # BP8.1 dust ('gauss' Cl model): T roof 1e7 uK_RJ^2 at BP's 545 GHz reference, scaled by the
      # MBB SED^2 (~1.6) to this file's 857 GHz reference; QU 5e2 at 353 GHz (same reference).
      Cl_prior_amplitude: [1.6e+7, 5.0e+2]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: [5.0, 10.0]  # arcmin; Gaussian rolloff of D_l
      beta: 1.56
      T: 20
      nu_ref: [857, 353]  # [I, QU]
      units: "uK_RJ"
      lmax: 1500
      spatially_varying_MM: False

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      longname: "Synchrotron"
      shortname: "sync"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_synch_amp_BP8.1_v1.fits"
      # BP8.1 synch ('gauss' Cl model): the T roof is effectively off (1e20; the Haslam-scale
      # signal at 408 MHz is only ~1e14 uK_RJ^2), so in T just the 60' rolloff acts; QU roof
      # 2e2 at 30 GHz with a 30' rolloff.
      Cl_prior_amplitude: [1.0e+20, 2.0e+2]  # D_l at l_pivot [I, QU]; uK_RJ^2 at nu_ref
      Cl_prior_l_pivot: 100
      Cl_prior_FWHM: [60.0, 30.0]  # arcmin; Gaussian rolloff of D_l
      beta: -3.1
      nu_ref: [0.408, 30]  # [I, QU]
      units: "uK_RJ"
      lmax: 1000
      spatially_varying_MM: False

  FreeFree:
    enabled: true
    component_class: "FreeFree"
    params:
      polarization: "IQU"
      longname: "Free-Free"
      shortname: "ff"
      init_from: "/mn/stornext/d23/cmbco/hfi/common/data/init_ff_amp_BP8.1_v1.fits"
      # BP8.1 free-free ('power_law_gauss' Cl model): rising D_l ~ l^2 roof (1e3 at l=50, 40 GHz)
      # with a 30' Gaussian rolloff.
      Cl_prior_amplitude: 1.0e+3  # D_l at l_pivot; uK_RJ^2 at nu_ref
      Cl_prior_beta: 2.0
      Cl_prior_l_pivot: 50
      Cl_prior_FWHM: 30.0  # arcmin; Gaussian rolloff of D_l
      T: 7000
      nu_ref: 40
      units: "uK_RJ"
      lmax: 1000
      spatially_varying_MM: False

