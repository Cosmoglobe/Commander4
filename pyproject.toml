# This file contains specifications for how pip will install Commander4 as a Python package.

# Build system and its dependencies.
[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core>=0.10",
    "cmake>=3.15",
    "pybind11",
    "pybind11-stubgen",
    "numpy"
    ]

# Package description and runtime depenencies
[project]
name = "commander4"
version = "0.1.0"
description = "Commander4: A Gibbs sampling framework for cosmological data analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy",
    "h5py",
    "pyyaml",
    "pyyaml-include",
    "mpi4py",
    "ducc0",
    "pixell",
    "healpy",
    "tqdm",
    "camb",
    "astropy",
    "numba",
    "pysm3>=3.4.6",
    "matplotlib",
    "numpy-quaternion",
    "qpoint",
    ]  # Add new Python runtime dependencies here.

# Adds the `commander4` command to PATH, executing `bin/commander4`
# Everything in `commander4/standalone_tools/` is callable as a script and imported by nothing;
# each one gets an entry point here.
[project.scripts]
commander4 = "commander4.cli:main"
c4-plot-chain = "commander4.standalone_tools.plot_chain:main"
c4-diff-params = "commander4.standalone_tools.diff_params:main"
c4-validate-params = "commander4.standalone_tools.validate_params:main"
c4-generate-stubs = "commander4.standalone_tools.generate_stubs:main"
c4-cmb-realizations = "commander4.standalone_tools.constrained_cmb_realizations:main"

# Test configuration. `testpaths` keeps a bare `pytest` run pointed at the test directory, and the
# default `python_files` glob (test_*.py) is what makes the file naming there matter.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.scikit-build]
# Keep it simple: CMake builds the extension, scikit-build-core packages the Python
# sources from the src-layout.

# Prefer Release unless user overrides via env/CMake args.
cmake.build-type = "Release"

# Explicitly force "redirect" mode (static path mapping)
editable.mode = "redirect"
# TODO: Maybe we want to switch to editable.mode = "inplace", which would place the compiled `.so`
# files directly into the source tree. Makes source tree more cluttered, but helps e.g. IDEs a bit.

# Explicitly disable auto-rebuilds on import to prevent MPI crashes
editable.rebuild = false

[tool.scikit-build.wheel]
packages = ["src/commander4"]

exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.ipynb_checkpoints",
    ".git",
    ".venv*"
]

[tool.scikit-build.sdist]
# Ensure the C++ sources + ducc0 submodule files make it into sdists.
include = [
    "CMakeLists.txt",
    "src/lib_cpp/**",
    "external/ducc0/src/**",
    "external/ducc0/LICENSE",
    "external/ducc0/ChangeLog",
    "README.md",
    "LICENSE",
    "src/commander4/**",
]

exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.so",
    "**/.ipynb_checkpoints",
    ".git",
    ".venv*"
]
