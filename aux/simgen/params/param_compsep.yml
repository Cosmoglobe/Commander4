# simgen: component-separation test simulation.
#
#   cd aux && mpirun -n 12 python -m simgen -p simgen/params/param_compsep.yml
#
# Features under test in the main code:
#   * `CG_sampling_groups_compsep` with `sample_class: amplitude_sampler_CG` -- the constrained
#     realization of the component amplitudes, including the C(l) prior S and the two RHS
#     fluctuation terms (`compsep.sample_amplitudes`).
#     Matching main parameter file: `params/sims/simparam_compsep_CG.yml`.
#   * `MCMC_sampling_groups_compsep` with `sample_class: sample_spectral_indices_uniform_MH` -- the
#     Metropolis-Hastings sampler over the dust and synchrotron spectral indices.
#     Matching main parameter file: `params/sims/simparam_compsep_MCMC.yml`.
#
# What makes this simulation a component-separation test:
#   * Six bands spanning 30-353 GHz -- an over-determined (6 bands, 3 components) system with real
#     spectral leverage: 30/44 GHz pin the synchrotron, 217/353 GHz pin the dust, 70/100 GHz are
#     CMB-dominated.
#   * Every component's frequency scaling comes from the *same* Commander4 SED class the main code
#     fits with (simgen.sky reuses `commander4.sky_models.component.<class>.get_sed`), so the sky is
#     exactly representable by the fitted model and any residual is an error, not a model mismatch.
#   * The spectral indices are spatially constant (a single template scaled by a scalar SED), which
#     is what the global-index MH sampler assumes -- so the truth is a single number per component:
#     beta_dust = 1.54 (at T = 20 K) and beta_sync = -3.10.  The MCMC parameter file starts them at
#     1.45 and -3.25 and should walk back.
#   * White noise only and unit gains: no TOD-domain sampling competes with the compsep step.
#
# NOTE the reference frequencies: dust is referenced to 353 GHz and synchrotron to 30 GHz here
# (rather than the 857/0.408 GHz of the Planck/BP parameter files), because the PySM template is
# realized *at* nu_ref.  The matching parameter files use the same nu_ref, and their C(l) prior
# amplitudes are quoted in (uK_RJ @ nu_ref)^2 accordingly.

general:
  nside: 64
  units: "uK_RJ"
  float_precision: "single"
  seed: 71
  output_dir: "../../c4_sims/simgen_compsep/"

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      shortname: "cmb"
      lmax: 191
      solar_dipole: false

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      shortname: "dust"
      beta: 1.54             # <- truth for the MH sampler
      T: 20
      nu_ref: 353
      lmax: 191
      template: {source: "pysm3", preset: "d0"}

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      shortname: "sync"
      beta: -3.1             # <- truth for the MH sampler
      nu_ref: 30
      lmax: 191
      template: {source: "pysm3", preset: "s5"}

simulation:
  # 400 x 600 s = 2.8 days; `anti_sun_period_days: 3.0` sweeps ~330 deg over the run, giving
  # full-sky coverage.  Fewer scans than the gain run: the compsep step only needs decent maps.
  nscans: 400
  scan_duration_sec: 600
  npsi: 4096
  orbital_dipole: true
  compress: true
  debug_output_dir: "../../c4_sims/simgen_compsep_debug/"

  pointing:
    strategy: "planck_scan"
    los_angle: 85.0
    spin_angle_tilt: 30.0
    spin_rate: 1.00165345964511
    anti_sun_period_days: 3.0
    precession_period_days: 0.8
    mission_start: "2009-08-13T00:00:00"

  noise:
    white: true
    oof: {enabled: false}

  modifiers:
    crosstalk: {enabled: false}

  transfer_function:
    enabled: false

experiments:
  SimSat:
    enabled: true
    bands:
      # A common sigma0 across bands keeps the exercise about spectral separation rather than about
      # relative band weights.  400 scans x 19500 samples x 4 detectors over 49152 pixels is ~635
      # hits/pixel, i.e. ~7 uK per pixel per Stokes parameter.
      Band30GHz:
        enabled: true
        freq: 30.0
        fwhm: 60.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det30_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det30_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det30_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det30_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band44GHz:
        enabled: true
        freq: 44.0
        fwhm: 50.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det44_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det44_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det44_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det44_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band70GHz:
        enabled: true
        freq: 70.0
        fwhm: 45.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det70_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det70_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det70_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det70_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band100GHz:
        enabled: true
        freq: 100.0
        fwhm: 45.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det100_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det100_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det100_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det100_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band217GHz:
        enabled: true
        freq: 217.0
        fwhm: 40.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det217_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det217_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det217_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det217_d: {psi_offset_deg: 135.0, gain: 1.0}

      Band353GHz:
        enabled: true
        freq: 353.0
        fwhm: 40.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          det353_a: {psi_offset_deg: 0.0,   gain: 1.0}
          det353_b: {psi_offset_deg: 45.0,  gain: 1.0}
          det353_c: {psi_offset_deg: 90.0,  gain: 1.0}
          det353_d: {psi_offset_deg: 135.0, gain: 1.0}
