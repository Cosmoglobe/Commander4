# simgen: partial-sky (small-patch) test simulation.
#
#   cd sims && mpirun -n 12 python -m simgen -p simgen/params/param_patch.yml
#
# Features under test in the main code: everything that only differs when the data cover a small
# fraction of the sky, as for a ground-based experiment --
#   * `experiments.<exp>.sparse_maps: true`, the per-rank local-pixel map layout
#     (`utils.pixel_domain`, `tod_processing._read_sparse_maps_flag`), which is only meaningfully
#     exercised when most of the sky is unobserved;
#   * component separation on a patch: unobserved pixels carry zero inverse-noise weight, so the CG
#     solution there is driven entirely by the C(l) prior, and the C(l) prior roof is what keeps the
#     unconstrained high-l modes from diverging;
#   * correlated-noise sampling with the deep repeat-scan coverage of a raster.
# Matching main parameter file: `params/sims/simparam_patch.yml`.
#
# What makes this simulation a partial-sky test:
#   * The `raster` pointing strategy sweeps a 25 x 25 deg patch centred well off the Galactic plane;
#     one scan is exactly one full fill of the patch, and the 60 scans are 60 repeat passes.
#   * `raster` uses per-detector pointing, so each detector's `fp_offset_deg` shifts its track and
#     the four detectors together cover a slightly larger, non-rectangular footprint -- the ragged
#     coverage edge that partial-sky mapmaking has to survive.
#   * `vsun = 0` for a raster, so there is no orbital dipole (`orbital_dipole: false` is consistent
#     with the analysis here, unlike for the satellite scans).
#   * 1/f noise is on: with ~2000 hits per pixel the patch is deep, so the sky is well measured and
#     any n_corr failure shows up directly in the residual rather than being lost in white noise.
#
# The footprint comes out at f_sky ~ 0.018 (~3500 pixels at nside 128 -- the 25 x 25 deg patch plus
# the detector offsets).  About 2% of those, the ragged edge, are hit too few times or over too
# narrow a range of polarization angle to constrain IQU; the mapmaker leaves such pixels at zero.
# Exercising that is part of the point.

general:
  nside: 128
  units: "uK_RJ"
  float_precision: "single"
  seed: 5150
  output_dir: "../../c4_sims/simgen_patch/"

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      shortname: "cmb"
      lmax: 383
      solar_dipole: false

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      shortname: "dust"
      beta: 1.54
      T: 20
      nu_ref: 353
      lmax: 383
      template: {source: "pysm3", preset: "d0"}

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      shortname: "sync"
      beta: -3.1
      nu_ref: 30
      lmax: 383
      template: {source: "pysm3", preset: "s5"}

simulation:
  # For the raster strategy one scan = n_rows * samples_per_row = 30000 samples and
  # `scan_duration_sec` is ignored.  60 scans = 60 full passes over the patch.
  nscans: 60
  scan_duration_sec: 1000   # ignored by the raster strategy; kept for documentation
  npsi: 4096
  orbital_dipole: false     # A raster has no orbital motion; vsun is zero either way.
  compress: true
  debug_output_dir: "../../c4_sims/simgen_patch_debug/"

  pointing:
    strategy: "raster"
    patch_center_deg: [40.0, -50.0]   # Galactic (lon, lat): off the plane, low foregrounds.
    patch_size_deg: [25.0, 25.0]
    n_rows: 150               # cross-scan rows -> 10' row spacing, oversampling the 27' pixel
    samples_per_row: 200      # along-scan samples -> 7.5' sample spacing

  noise:
    white: true
    oof: {enabled: true, fknee: 0.2, alpha: -1.2}

  modifiers:
    crosstalk: {enabled: false}

  transfer_function:
    enabled: false

experiments:
  PatchTel:
    enabled: true
    bands:
      # Three SO-like frequencies: 90/150 straddle the CMB minimum, 220 pins the dust.  The
      # focal-plane offsets stagger the detectors across the patch; the polarization-angle offsets
      # make each pixel's Q/U solvable.
      Band90GHz:
        enabled: true
        freq: 90.0
        fwhm: 30.0
        fsamp: 30.0
        eval_nside: 128
        data_nside: 128
        sigma0: 200.0
        polarization: "IQU"
        detectors:
          det90_a: {psi_offset_deg: 0.0,   fp_offset_deg: [0.0, 0.0], gain: 1.0}
          det90_b: {psi_offset_deg: 45.0,  fp_offset_deg: [0.0, 1.5], gain: 1.0}
          det90_c: {psi_offset_deg: 90.0,  fp_offset_deg: [1.5, 0.0], gain: 1.0}
          det90_d: {psi_offset_deg: 135.0, fp_offset_deg: [1.5, 1.5], gain: 1.0}

      Band150GHz:
        enabled: true
        freq: 150.0
        fwhm: 30.0
        fsamp: 30.0
        eval_nside: 128
        data_nside: 128
        sigma0: 200.0
        polarization: "IQU"
        detectors:
          det150_a: {psi_offset_deg: 0.0,   fp_offset_deg: [0.0, 0.0], gain: 1.0}
          det150_b: {psi_offset_deg: 45.0,  fp_offset_deg: [0.0, 1.5], gain: 1.0}
          det150_c: {psi_offset_deg: 90.0,  fp_offset_deg: [1.5, 0.0], gain: 1.0}
          det150_d: {psi_offset_deg: 135.0, fp_offset_deg: [1.5, 1.5], gain: 1.0}

      Band220GHz:
        enabled: true
        freq: 220.0
        fwhm: 30.0
        fsamp: 30.0
        eval_nside: 128
        data_nside: 128
        sigma0: 400.0
        polarization: "IQU"
        detectors:
          det220_a: {psi_offset_deg: 0.0,   fp_offset_deg: [0.0, 0.0], gain: 1.0}
          det220_b: {psi_offset_deg: 45.0,  fp_offset_deg: [0.0, 1.5], gain: 1.0}
          det220_c: {psi_offset_deg: 90.0,  fp_offset_deg: [1.5, 0.0], gain: 1.0}
          det220_d: {psi_offset_deg: 135.0, fp_offset_deg: [1.5, 1.5], gain: 1.0}
