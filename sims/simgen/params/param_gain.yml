# simgen: gain-calibration test simulation, in raw detector units.
#
#   cd sims && mpirun -n 8 python -m simgen -p simgen/params/param_gain.yml
#
# Analysed by `params/sims/simparam_gain.yml`.
#
# INJECTED TRUTH, what the analysis has to recover:
#   * abs_gain = 1.0e-9 in every band (the four detector gains average to exactly that).
#   * rel_gain = 30 GHz  [-0.10, -0.03, +0.03, +0.10] x 1e-9
#                100 GHz [-0.08, -0.02, +0.02, +0.08] x 1e-9
#                217 GHz [-0.05, -0.01, +0.01, +0.05] x 1e-9
#   * Per-component amplitude maps, written as `truth_<Component>.fits` in `debug_output_dir`.
#
# WHY THIS IS A GAIN TEST:
#   * `orbital_dipole: true` with a satellite scan whose spin axis sweeps a full anti-Sun circle
#     over the mission, so v_orb rotates through the sky and the orbital dipole is a *time-varying*
#     calibrator rather than a static template. This is the signal `calibrate_against:
#     orbital_dipole` uses, and it is what makes absolute gain identifiable at all.
#   * Detector gains differ within each band but average to the band gain, so the absolute and
#     relative parts are separately identifiable: a sampler that gets only the mean right is
#     visibly distinguishable from one that gets both right.
#   * The gains are ~1e-9 and sigma0 is scaled to match, i.e. the TODs are in *raw detector units*
#     rather than uK_RJ. That puts the unit and gain-scale bookkeeping (`band_unit`, the micro-gain
#     convention in the `scalars` dataset, gain-weighted mapmaking) under test at values where a
#     missing or doubled conversion factor is obvious. Every other simulation here uses gain 1.0 in
#     uK_RJ and would not catch such an error.
#   * The beams span 120' to 40', so the bands are at genuinely different resolutions.
#   * White noise only, so the gain step is not competing with correlated-noise sampling.

general:
  nside: 64                 # Working HEALPix nside for sky-map construction.
  units: "uK_RJ"            # Sky unit; detector `gain` converts it to stored TOD units.
  float_precision: "single"   # Required by the reused Commander4 component constructors.
  seed: 4242                # Base RNG seed (CMB realization + per-(band,scan,det) noise).
  output_dir: "../../c4_sims/simgen_gain/"

# Three components over three well-separated frequencies: enough for the matching run to do a
# determined (3 bands, 3 components) component separation, so `rel_gain`'s `full_sky` calibrator is
# a sky model that actually fits the data.
components:
  CMB:
    enabled: true
    component_class: "CMB"
    params:
      polarization: "IQU"
      shortname: "cmb"
      lmax: 191
      solar_dipole: true     # The static l=1 dipole; the *orbital* dipole comes from the pointing.

  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params:
      polarization: "IQU"
      shortname: "dust"
      beta: 1.54
      T: 20
      nu_ref: 353            # GHz; the PySM template is realized here and scaled by the C4 MBB SED.
      lmax: 191
      template: {source: "pysm3", preset: "d0"}

  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params:
      polarization: "IQU"
      shortname: "sync"
      beta: -3.1
      nu_ref: 30
      lmax: 191
      template: {source: "pysm3", preset: "s5"}

simulation:
  # 800 x 600 s = 5.6 days of mission time.  With `anti_sun_period_days: 6.0` the anti-Sun direction
  # sweeps ~330 deg over the run: full-sky coverage, and an orbital-dipole axis that rotates almost
  # all the way round, which is what breaks the gain/monopole degeneracy.
  nscans: 800
  scan_duration_sec: 600    # -> 19500 samples/scan at 32.5 Hz.
  npsi: 4096
  orbital_dipole: true      # MUST stay true: the main code always subtracts a dipole built from the
                            # `vsun` stored in the files, so satellite pointing without it
                            # would be inconsistent with the analysis.
  compress: true
  debug_output_dir: "../../c4_sims/simgen_gain_debug/"

  pointing:
    strategy: "planck_scan"
    los_angle: 85.0
    spin_angle_tilt: 30.0
    spin_rate: 1.00165345964511  # rpm
    anti_sun_period_days: 6.0    # Accelerated sky sweep; v_orb keeps its physical 30 km/s.
    precession_period_days: 1.5  # ~3.7 spin-axis wobbles over the run -> good cross-linking.
    mission_start: "2009-08-13T00:00:00"

  noise:
    white: true
    oof: {enabled: false}    # Pure white noise: an uncontaminated gain-recovery test.

  modifiers:
    crosstalk: {enabled: false}

  transfer_function:
    enabled: false

experiments:
  SimSat:
    enabled: true
    bands:
      # Per-band detector gains are spread around a mean of exactly 1.0, so the truth decomposes
      # cleanly into abs_gain = 1.0 and the listed relative offsets.
      Band30GHz:
        enabled: true
        freq: 30.0          # GHz
        fwhm: 120.0          # arcmin (>= the 55' nside=64 pixel)
        fsamp: 32.5         # Hz
        eval_nside: 64
        data_nside: 64
        sigma0: 1.0e-7      # Per-sample RMS in raw detector units (= 100 uK_RJ at gain 1e-9).
        polarization: "IQU"
        detectors:          # rel_gain truth: [-0.10, -0.03, +0.03, +0.10]
          det30_a: {psi_offset_deg: 0.0,   gain: 0.90e-9}
          det30_b: {psi_offset_deg: 45.0,  gain: 0.97e-9}
          det30_c: {psi_offset_deg: 90.0,  gain: 1.03e-9}
          det30_d: {psi_offset_deg: 135.0, gain: 1.10e-9}

      Band100GHz:
        enabled: true
        freq: 100.0
        fwhm: 70.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 8.0e-8
        polarization: "IQU"
        detectors:          # rel_gain truth: [-0.08, -0.02, +0.02, +0.08]
          det100_a: {psi_offset_deg: 0.0,   gain: 0.92e-9}
          det100_b: {psi_offset_deg: 45.0,  gain: 0.98e-9}
          det100_c: {psi_offset_deg: 90.0,  gain: 1.02e-9}
          det100_d: {psi_offset_deg: 135.0, gain: 1.08e-9}

      Band217GHz:
        enabled: true
        freq: 217.0
        fwhm: 40.0
        fsamp: 32.5
        eval_nside: 64
        data_nside: 64
        sigma0: 1.2e-7
        polarization: "IQU"
        detectors:          # rel_gain truth: [-0.05, -0.01, +0.01, +0.05]
          det217_a: {psi_offset_deg: 0.0,   gain: 0.95e-9}
          det217_b: {psi_offset_deg: 45.0,  gain: 0.99e-9}
          det217_c: {psi_offset_deg: 90.0,  gain: 1.01e-9}
          det217_d: {psi_offset_deg: 135.0, gain: 1.05e-9}
