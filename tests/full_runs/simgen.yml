# The simulation behind the full-run tests (test_full_runs.py). Kept as small as a run allows:
# nside 16, 24 scans of 30 min at 8 Hz, three bands. The Planck-like scan is sped up (one anti-Sun
# turn per day, fast precession) so that the 12 hours of data hit every pixel.
# Band353 is intensity only, at nside 8; its TOD is not analysed: the test turns its binned map into
# a file band. Its beam is wide and its noise high on purpose. Commander4 realizes the components
# up to their own lmax (47) when it evaluates chi^2 at nside 8, above the band's limit of 23
# (notes/C4_issues.md, C10), and run B regrids this map to nside 16; at a narrow beam and a
# signal-to-noise of ~800 either one gives a reduced chi^2 in the thousands.
# All paths are relative to the working directory the test runs in.
general:
  nside: 16
  units: "uK_RJ"
  double_precision: false
  seed: 7
  output_dir: "sim"

components:
  CMB:
    enabled: true
    component_class: "CMB"
    params: {polarization: "IQU", shortname: "cmb", lmax: 47, solar_dipole: false}
  ThermalDust:
    enabled: true
    component_class: "ThermalDust"
    params: {polarization: "IQU", shortname: "dust", beta: 1.54, T: 20, nu_ref: 353, lmax: 47,
             template: {source: "pysm3", preset: "d0"}}
  Synchrotron:
    enabled: true
    component_class: "Synchrotron"
    params: {polarization: "IQU", shortname: "sync", beta: -3.1, nu_ref: 30, lmax: 47,
             template: {source: "pysm3", preset: "s5"}}

simulation:
  nscans: 24
  scan_duration_sec: 1800
  orbital_dipole: true
  compress: true
  debug_output_dir: "sim_debug"
  pointing:
    strategy: "planck_scan"
    anti_sun_period_days: 1.0
    precession_period_days: 0.05
  noise:
    white: true
    oof: {enabled: true, fknee: 0.2, alpha: -1.5}
  modifiers:
    crosstalk: {enabled: false}
  transfer_function:
    enabled: false

experiments:
  SimSat:
    enabled: true
    bands:
      Band030:
        enabled: true
        freq: 30.0
        fwhm: 300.0
        fsamp: 8.0
        eval_nside: 16
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          d030a: {psi_offset_deg: 0.0}
          d030b: {psi_offset_deg: 45.0}
          d030c: {psi_offset_deg: 90.0}
          d030d: {psi_offset_deg: 135.0}
      Band100:
        enabled: true
        freq: 100.0
        fwhm: 240.0
        fsamp: 8.0
        eval_nside: 16
        sigma0: 60.0
        polarization: "IQU"
        detectors:
          d100a: {psi_offset_deg: 0.0}
          d100b: {psi_offset_deg: 45.0}
          d100c: {psi_offset_deg: 90.0}
          d100d: {psi_offset_deg: 135.0}
      Band353:
        enabled: true
        freq: 353.0
        fwhm: 600.0
        fsamp: 8.0
        eval_nside: 8
        sigma0: 2000.0
        polarization: "I"
        detectors:
          d353a: {}
          d353b: {}
